<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <header>
            <h1>🔥 坦克大战 🔥</h1>
            <div class="stats">
                <div class="stat">
                    <span class="label">生命</span>
                    <span id="lives" class="value">3</span>
                </div>
                <div class="stat">
                    <span class="label">得分</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="stat">
                    <span class="label">关卡</span>
                    <span id="level" class="value">1</span>
                </div>
                <div class="stat">
                    <span class="label">剩余敌人</span>
                    <span id="enemies-left" class="value">0</span>
                </div>
            </div>
        </header>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="controls">
            <p><strong>操作说明：</strong>WASD 或方向键移动，空格键射击</p>
            <button id="startBtn">开始游戏</button>
            <button id="restartBtn" class="hidden">重新开始</button>
        </div>

        <div id="message" class="message hidden"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
